<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Precision Brand Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />

  <!-- Outer Fine Medical Ring -->
  <circle cx="50" cy="50" r="40" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 2" />

  <!-- Primary Spinal Arc (Deep Navy Ribbon) -->
  <path d="M 38 68 C 30 54 36 34 50 30 C 64 26 72 36 66 48 C 62 56 46 54 44 66 C 42 78 58 78 68 68" 
        stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Posture Wave Ribbon (Vibrant Teal Accent) -->
  <path d="M 62 32 C 70 46 64 66 50 70 C 36 74 28 64 34 52 C 38 44 54 46 56 34 C 58 22 42 22 32 32" 
        stroke="#0D9488" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Alignment Point (Gleaming Cyan Node) -->
  <circle cx="50" cy="50" r="4.5" fill="#38BDF8" />

  <!-- Gradient Background Definition -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#08162E" />
    </linearGradient>
  </defs>
</svg>
