<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Therapeutic Support Ring (Teal Gradient) -->
  <path d="M 25 65 C 20 40 38 20 60 20 C 82 20 100 40 95 65 C 90 85 70 100 50 98" 
        stroke="url(#tealGradient)" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Spinal Column Vertebrae Dots (Chiropractic & Spine Health) -->
  <circle cx="50" cy="36" r="3.5" fill="#0D9488" />
  <circle cx="48" cy="46" r="3.5" fill="#0D9488" />
  <circle cx="48" cy="56" r="3.5" fill="#0D9488" />
  <circle cx="51" cy="66" r="3.5" fill="#0D9488" />
  <circle cx="56" cy="75" r="3.5" fill="#0D9488" />

  <!-- Active Human Figure in Motion / Rehabilitation Pose (Deep Navy) -->
  <!-- Figure Head -->
  <circle cx="68" cy="30" r="7" fill="#0F2C59" />

  <!-- Active Dynamic Body / Motion Arc -->
  <path d="M 66 38 C 55 42 46 54 48 68 C 50 80 62 88 74 92" 
        stroke="#0F2C59" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Restored Movement Arm Ribbon -->
  <path d="M 40 45 C 55 40 75 36 86 42" 
        stroke="#0284C7" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Color Gradients -->
  <defs>
    <linearGradient id="tealGradient" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
</svg>
